<!doctype html>
<html><head><meta charset="utf-8"><title>Tab Labeler promo</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:440px;height:280px;background:#151517;color:#F2F0EB;font-family:"Segoe UI",Inter,sans-serif;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,#CDB68E,#7d6640)}

.strip{display:flex;gap:3px}
.t{flex:1;height:34px;border-radius:8px 8px 0 0;background:#26262A;font-size:14px;display:flex;align-items:center;padding:0 9px;white-space:nowrap;overflow:hidden;color:#F2F0EB}
.t.g{background:#2E2A22;color:#CDB68E}
</style></head><body>
<div class="top"><span class="mark"></span><h1>Tab Labeler</h1></div>
<p>Tab names you can tell apart.</p>
<div class="strip"><div class="t">Telomere</div><div class="t g">Shortening</div><div class="t">Explained</div><div class="t">Hayflick</div></div>
</body></html>
