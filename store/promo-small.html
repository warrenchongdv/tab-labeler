<!doctype html>
<html><head><meta charset="utf-8"><title>Tab Labeler promo</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:440px;height:280px;background:#151517;color:#F2F0EB;font-family:"Segoe UI",Inter,sans-serif;padding:32px 30px 0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,#CDB68E,#7d6640)}
h1{font-size:30px;font-weight:650;letter-spacing:-.03em}
p{font-size:18px;color:#B9B6AF;line-height:1.35}
.strip{display:flex;gap:3px}
.t{flex:1;height:38px;border-radius:9px 9px 0 0;background:#26262A;font-size:15px;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;color:#F2F0EB}
.t.g{background:#F2F0EB;color:#151517;font-weight:600}
</style></head><body>
<div class="top"><span class="mark"></span><h1>Tab Labeler</h1></div>
<p>Find the right tab on the first try.<br>No setup. Nothing leaves your browser.</p>
<div class="strip"><div class="t">Budget</div><div class="t g">Roadmap</div><div class="t">Kickoff</div><div class="t">Pricing</div></div>
</body></html>
